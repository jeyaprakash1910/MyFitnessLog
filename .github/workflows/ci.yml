name: CI

# Runs the Android and web test suites on every push and pull request.
#
# Until now nothing ran the tests automatically: the only workflow here was the
# nightly database backup, so the suites ran when somebody remembered. That is
# how a wrong column type in a Room migration reached main on 2026-08-07, caught
# by hand rather than by anything systematic.
#
# The backend runs here too, against a PostgreSQL service container. This job was
# always unaffected by TD-016, because a runner has no editor rewriting its build
# output; that is now resolved anyway, so locally plain `mvn test` works too.
#
# The Android suite is intermittently flaky (TD-015): a leaked coroutine still
# using Dispatchers.Main makes about one run in forty fail while the code is fine.
# That was one run in four until 2026-08-08, when two causes were fixed; one of
# them was a real defect in WorkoutViewModel rather than a test problem. Five
# approaches to the remainder are recorded as measured failures in TD-015, so read
# it before trying a sixth. A failed test is retried once here and reported as
# FLAKY, configured in android/app/build.gradle.kts.
#
# So a red Android job means a real failure, not the flake. Check the run summary
# for FLAKY entries to see whether the flake is still occurring and how often.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch: {}

# A newer push makes an in-flight run obsolete, except on main where every commit
# should get its own verdict.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  android:
    name: Android unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # JDK 17: app/build.gradle.kts pins jvmToolchain(17) and both source and
      # target compatibility. This is not the backend's Java 21.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # No local.properties in CI. That is fine and intentional: apiBaseUrl falls
      # back to the emulator loopback and apiKey to empty, which is exactly the
      # configuration the unit tests expect. Only a signed release build needs
      # real values, and CI does not produce one.
      - name: Unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --console=plain

      # Compiling the release variant catches what a debug-only build misses:
      # the generated network security config, the release manifest merge, and
      # resource shrinking rules. It stops short of packaging, which would need
      # the signing keystore.
      - name: Release variant compiles
        if: '!cancelled()'
        working-directory: android
        run: ./gradlew :app:compileReleaseKotlin --console=plain

      # Lint runs here so an Error-severity regression cannot reach main. The
      # baseline at the time this was added was 0 errors and 83 warnings, mostly
      # obsolete dependency versions, so only errors fail the build
      # (lintOptions.abortOnError applies to errors, not warnings).
      - name: Lint
        if: '!cancelled()'
        working-directory: android
        run: ./gradlew :app:lintDebug --console=plain

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: android-test-report
          path: |
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/reports/lint-results-debug.html
          retention-days: 7

  # Instrumented tests need a real Android runtime, so they get their own job
  # with an emulator. This exists because of a specific near miss: on 2026-08-07
  # a Room migration with a wrong column type reached main and was caught by
  # hand. MigrationTest would have caught it, but nothing ran it: it lives in
  # androidTest/, and until now no job here could execute that source set.
  #
  # Migration bugs are the worst class of defect this project can ship, because
  # synchronisation is one-way (ADR-0003) and a corrupted local database cannot
  # be rebuilt from the backend. So these run on every push, not nightly.
  #
  # The emulator is deliberately the target: the device-safety guard in
  # app/build.gradle.kts refuses connectedAndroidTest against physical hardware,
  # after an uninstall destroyed real training data on 2026-07-22.
  android-instrumented:
    name: Android instrumented tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # The emulator needs hardware acceleration to be usable; without KVM the
      # job runs on a software renderer and times out rather than failing
      # honestly.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # API 30 with the AOSP ATD image: no Google Play services are needed, and
      # the ATD images boot substantially faster.
      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: android
          script: ./gradlew :app:connectedDebugAndroidTest --console=plain

      - name: Upload instrumented test report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: android-instrumented-report
          path: android/app/build/reports/androidTests/connected/
          retention-days: 7

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # Postgres 17 to match Supabase in production. The suite deliberately runs
      # against real PostgreSQL rather than H2, so that quoted identifiers, CHECK
      # constraints, enum storage and NUMERIC precision behave as they will in
      # production (see src/test/resources/application.yml).
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: myfitnesslog_test
          POSTGRES_USER: myfitnesslog
          POSTGRES_PASSWORD: myfitnesslog
        ports:
          - 5432:5432
        # Without a health check the job races the database and fails on a
        # connection refused before Postgres has finished starting.
        options: >-
          --health-cmd "pg_isready -U myfitnesslog -d myfitnesslog_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      # JDK 21: pom.xml sets java.version to 21. This is not the Android
      # module's 17.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Flyway builds the schema on boot, so the empty database the service
      # container provides is all this needs.
      - name: Tests
        working-directory: backend
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/myfitnesslog_test
          TEST_DB_USERNAME: myfitnesslog
          TEST_DB_PASSWORD: myfitnesslog
        run: mvn -B clean test

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: backend-test-report
          path: backend/target/surefire-reports/
          retention-days: 7

  web:
    name: Web tests, types and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # package.json declares engines.node >= 20.19.
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `npm ci` rather than `npm install`: it installs exactly the lockfile and
      # fails if the two have drifted, so CI cannot silently test a different
      # dependency tree than a developer has.
      - name: Install
        working-directory: web
        run: npm ci

      # Each step runs even if an earlier one failed, so a single push reports
      # every problem at once instead of one per re-run.
      - name: Types
        working-directory: web
        run: npm run typecheck

      - name: Lint
        if: '!cancelled()'
        working-directory: web
        run: npm run lint

      - name: Format
        if: '!cancelled()'
        working-directory: web
        run: npm run format:check

      # The four live-backend tests skip on their own when no backend is named,
      # so this needs no special handling (TD-013).
      - name: Tests
        if: '!cancelled()'
        working-directory: web
        run: npm test
