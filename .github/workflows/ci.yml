name: CI

# Runs the Android and web test suites on every push and pull request.
#
# Until now nothing ran the tests automatically: the only workflow here was the
# nightly database backup, so the suites ran when somebody remembered. That is
# how a wrong column type in a Room migration reached main on 2026-08-07, caught
# by hand rather than by anything systematic.
#
# The backend runs here too, against a PostgreSQL service container. This job was
# always unaffected by TD-016, because a runner has no editor rewriting its build
# output; that is now resolved anyway, so locally plain `mvn test` works too.
#
# The Android suite is intermittently flaky (TD-015): a leaked coroutine still
# using Dispatchers.Main makes roughly one run in four fail while the code is
# fine. Three fix attempts were measured and reverted. Until the cause is found,
# a failed test is retried once here and reported as FLAKY, configured in
# android/app/build.gradle.kts.
#
# So a red Android job means a real failure, not the flake. Check the run summary
# for FLAKY entries to see whether the flake is still occurring and how often.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch: {}

# A newer push makes an in-flight run obsolete, except on main where every commit
# should get its own verdict.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  android:
    name: Android unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # JDK 17: app/build.gradle.kts pins jvmToolchain(17) and both source and
      # target compatibility. This is not the backend's Java 21.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # No local.properties in CI. That is fine and intentional: apiBaseUrl falls
      # back to the emulator loopback and apiKey to empty, which is exactly the
      # configuration the unit tests expect. Only a signed release build needs
      # real values, and CI does not produce one.
      - name: Unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --console=plain

      # Compiling the release variant catches what a debug-only build misses:
      # the generated network security config, the release manifest merge, and
      # resource shrinking rules. It stops short of packaging, which would need
      # the signing keystore.
      - name: Release variant compiles
        working-directory: android
        run: ./gradlew :app:compileReleaseKotlin --console=plain

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: android-test-report
          path: android/app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # Postgres 17 to match Supabase in production. The suite deliberately runs
      # against real PostgreSQL rather than H2, so that quoted identifiers, CHECK
      # constraints, enum storage and NUMERIC precision behave as they will in
      # production (see src/test/resources/application.yml).
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: myfitnesslog_test
          POSTGRES_USER: myfitnesslog
          POSTGRES_PASSWORD: myfitnesslog
        ports:
          - 5432:5432
        # Without a health check the job races the database and fails on a
        # connection refused before Postgres has finished starting.
        options: >-
          --health-cmd "pg_isready -U myfitnesslog -d myfitnesslog_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      # JDK 21: pom.xml sets java.version to 21. This is not the Android
      # module's 17.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Flyway builds the schema on boot, so the empty database the service
      # container provides is all this needs.
      - name: Tests
        working-directory: backend
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/myfitnesslog_test
          TEST_DB_USERNAME: myfitnesslog
          TEST_DB_PASSWORD: myfitnesslog
        run: mvn -B clean test

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: backend-test-report
          path: backend/target/surefire-reports/
          retention-days: 7

  web:
    name: Web tests, types and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # package.json declares engines.node >= 20.19.
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `npm ci` rather than `npm install`: it installs exactly the lockfile and
      # fails if the two have drifted, so CI cannot silently test a different
      # dependency tree than a developer has.
      - name: Install
        working-directory: web
        run: npm ci

      # Each step runs even if an earlier one failed, so a single push reports
      # every problem at once instead of one per re-run.
      - name: Types
        working-directory: web
        run: npm run typecheck

      - name: Lint
        if: '!cancelled()'
        working-directory: web
        run: npm run lint

      - name: Format
        if: '!cancelled()'
        working-directory: web
        run: npm run format:check

      # The four live-backend tests skip on their own when no backend is named,
      # so this needs no special handling (TD-013).
      - name: Tests
        if: '!cancelled()'
        working-directory: web
        run: npm test
