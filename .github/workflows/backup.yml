name: Database Backup

# Daily logical backup of the Supabase database, stored as a private GitHub
# Actions artifact. Rationale and restore steps: docs/development/BACKUP.md.
#
# Dumps are deliberately NOT committed to a branch in this repository. The repo is
# public; artifacts are not. A dump is real database content, so publishing one
# nightly would leak every future user's data the moment multi-user auth lands.
#
# One secret is required (repo -> Settings -> Secrets and variables -> Actions):
#   SUPABASE_SESSION_URL  full connection string to the SESSION pooler (port 5432),
#                         including the password and ?sslmode=require. The session
#                         pooler is used because the transaction pooler (6543) does
#                         not support pg_dump reliably.

on:
  schedule:
    - cron: "17 2 * * *"      # daily at 02:17 UTC
  workflow_dispatch: {}         # manual "Run workflow" button

# Never run two backups at once.
concurrency:
  group: db-backup
  cancel-in-progress: false

# How long GitHub retains each dump artifact, in days (90 is the maximum on
# current plans). Dumps are tiny (a personal lifting log is KB-to-MB).
env:
  KEEP_DAYS: "60"
  # Match your Supabase Postgres MAJOR version. pg_dump's client major must be >=
  # the server's. Supabase reports it under Project Settings -> Infrastructure.
  PG_IMAGE: "postgres:17"

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: read            # nothing is written back to the repository
    steps:
      - name: Dump and gzip
        env:
          DB_URL: ${{ secrets.SUPABASE_SESSION_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DB_URL:-}" ]; then
            echo "::error::SUPABASE_SESSION_URL secret is not set"; exit 1
          fi
          ts="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          mkdir -p out
          # --no-owner/--no-privileges keep the dump portable across roles, so it
          # restores cleanly into a fresh database owned by any user.
          docker run --rm -i "$PG_IMAGE" \
            pg_dump --no-owner --no-privileges "$DB_URL" \
            | gzip -9 > "out/myfitnesslog-${ts}.sql.gz"
          # Guard against a silent empty/failed dump.
          bytes=$(gzip -l "out/myfitnesslog-${ts}.sql.gz" | awk 'NR==2 {print $2}')
          echo "Uncompressed size: ${bytes} bytes"
          if [ "${bytes:-0}" -lt 1000 ]; then
            echo "::error::Dump looks too small (${bytes} bytes) — treating as failure"; exit 1
          fi
          echo "DUMP=out/myfitnesslog-${ts}.sql.gz" >> "$GITHUB_ENV"

      - name: Upload the dump as a private artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: ${{ env.DUMP }}
          retention-days: ${{ env.KEEP_DAYS }}
          if-no-files-found: error
          compression-level: 0    # already gzipped
