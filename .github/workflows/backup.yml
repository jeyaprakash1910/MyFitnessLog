name: Database Backup

# Daily logical backup of the Supabase database to an orphan `backups` branch in
# this same repository. Rationale and restore steps: docs/development/BACKUP.md.
#
# One secret is required (repo -> Settings -> Secrets and variables -> Actions):
#   SUPABASE_SESSION_URL  full connection string to the SESSION pooler (port 5432),
#                         including the password and ?sslmode=require. The session
#                         pooler is used because the transaction pooler (6543) does
#                         not support pg_dump reliably.

on:
  schedule:
    - cron: "17 2 * * *"      # daily at 02:17 UTC
  workflow_dispatch: {}         # manual "Run workflow" button

# Never run two backups at once.
concurrency:
  group: db-backup
  cancel-in-progress: false

# Keep, on the branch, this many most-recent dumps. Dumps are tiny (a personal
# lifting log is KB-to-MB), so this is generous; older files are pruned from the
# working tree but remain in branch history.
env:
  KEEP: "60"
  # Match your Supabase Postgres MAJOR version. pg_dump's client major must be >=
  # the server's. Supabase reports it under Project Settings -> Infrastructure.
  PG_IMAGE: "postgres:17"

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write           # push to the backups branch with the built-in token
    steps:
      - name: Dump and gzip
        env:
          DB_URL: ${{ secrets.SUPABASE_SESSION_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DB_URL:-}" ]; then
            echo "::error::SUPABASE_SESSION_URL secret is not set"; exit 1
          fi
          ts="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          mkdir -p out
          # --no-owner/--no-privileges keep the dump portable across roles, so it
          # restores cleanly into a fresh database owned by any user.
          docker run --rm -i "$PG_IMAGE" \
            pg_dump --no-owner --no-privileges "$DB_URL" \
            | gzip -9 > "out/myfitnesslog-${ts}.sql.gz"
          # Guard against a silent empty/failed dump.
          bytes=$(gzip -l "out/myfitnesslog-${ts}.sql.gz" | awk 'NR==2 {print $2}')
          echo "Uncompressed size: ${bytes} bytes"
          if [ "${bytes:-0}" -lt 1000 ]; then
            echo "::error::Dump looks too small (${bytes} bytes) — treating as failure"; exit 1
          fi
          echo "DUMP=out/myfitnesslog-${ts}.sql.gz" >> "$GITHUB_ENV"

      - name: Publish to backups branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config --global user.name  "backup-bot"
          git config --global user.email "backup-bot@users.noreply.github.com"

          # Clone the existing backups branch, or create it as an orphan the first time.
          if git clone --depth 1 --branch backups "$repo_url" bk 2>/dev/null; then
            cd bk
          else
            mkdir bk && cd bk && git init -q && git remote add origin "$repo_url"
            git checkout -q --orphan backups
          fi

          mkdir -p dumps
          cp "../${DUMP}" dumps/

          # Retention: keep the newest $KEEP dumps in the working tree.
          ls -1 dumps/*.sql.gz | sort | head -n -"${KEEP}" | xargs -r git rm -q --ignore-unmatch

          git add dumps/
          git commit -q -m "backup: $(basename "${DUMP}")"
          git push -q origin backups
          echo "Pushed $(basename "${DUMP}") to the backups branch."
