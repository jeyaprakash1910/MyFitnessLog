# Application version — the single source of truth for what MyFitnessLog calls
# itself. Tracked in Git, unlike local.properties.
#
# Edit ONLY versionName, and only as part of cutting a release
# (docs/RELEASE_CHECKLIST.md). versionCode is derived from it in
# app/build.gradle.kts and must never be written here: a hand-maintained
# versionCode is a value someone eventually forgets to bump, and Android
# refuses an upgrade whose versionCode did not increase — which surfaces as a
# confusing install failure rather than as the omission it is.
#
# Format: MAJOR.MINOR.PATCH, all integers, MINOR and PATCH each 0-99.
#
#   MAJOR  a release with a changed data or sync contract, or a milestone
#          version boundary (V1 -> V2 brings authentication)
#   MINOR  new user-visible capability within the same contract
#   PATCH  fixes only
versionName=1.8.0
