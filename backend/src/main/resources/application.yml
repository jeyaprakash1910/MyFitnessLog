spring:
  application:
    name: myfitnesslog

  datasource:
    url: jdbc:postgresql://localhost:5432/myfitnesslog
    username: ${DB_USERNAME:myfitnesslog}
    password: ${DB_PASSWORD:myfitnesslog}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    root: INFO
