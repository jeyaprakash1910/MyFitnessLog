spring:
  application:
    name: myfitnesslog

  datasource:
    url: jdbc:postgresql://localhost:5432/myfitnesslog
    username: ${DB_USERNAME:myfitnesslog}
    password: ${DB_PASSWORD:myfitnesslog}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  # Shared secret for the X-API-Key auth boundary. Empty in dev/test disables
  # authentication (see ApiKeyAuthFilter); production sets APP_API_KEY.
  api-key: ${APP_API_KEY:}
  cors:
    # Browser origins permitted to read this API (GET only, no credentials).
    # Defaults to the Vite dev server; override per deployment. Empty disables CORS.
    allowed-origins: ${WEB_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

logging:
  level:
    root: INFO
